name: Deploy to Firebase Hosting
on:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/test.mjs

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: npm install -g firebase-tools
      - run: firebase deploy --only hosting,firestore,storage --token "${{ secrets.FIREBASE_TOKEN }}" --project backstage-music
