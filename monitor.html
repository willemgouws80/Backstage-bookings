<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Booking Monitor</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#111;color:#eee;min-height:100vh;display:flex;align-items:center;justify-content:center}
#login{text-align:center;display:flex;flex-direction:column;gap:.6rem;width:280px}
#login h1{font-size:1.1rem;color:#C9911A;margin-bottom:.5rem}
#login input{padding:.6rem;background:#222;border:1px solid #333;border-radius:3px;color:#eee;font-size:.85rem}
#login button{padding:.6rem;background:#C9911A;color:#000;border:none;border-radius:3px;font-weight:600;cursor:pointer;font-size:.85rem}
#login .err{color:#e74c3c;font-size:.75rem}
#dashboard{display:none;width:100%;max-width:600px;margin:auto;padding:1rem}
#dashboard h1{font-size:1.1rem;color:#C9911A;margin-bottom:.3rem}
#status{font-size:.75rem;color:#666;margin-bottom:1rem}
.entry{border:1px solid #333;border-radius:4px;padding:.6rem;margin-bottom:.4rem;font-size:.82rem}
.entry .name{font-weight:600;color:#e8b040}
.entry .detail{color:#888;font-size:.72rem;margin-top:.2rem}
.entry.new{animation:flash 2s}
@keyframes flash{0%{background:#C9911A22}100%{background:transparent}}
#logout{font-size:.72rem;color:#666;cursor:pointer;text-decoration:underline;margin-top:.5rem;display:inline-block}
</style>
</head>
<body>
<div id="login">
  <h1>🔐 Booking Monitor</h1>
  <input type="email" id="email" placeholder="Email" autocomplete="email">
  <input type="password" id="pass" placeholder="Password" autocomplete="current-password">
  <button onclick="signIn()">Sign In</button>
  <div class="err" id="err"></div>
</div>
<div id="dashboard">
  <div style="display:flex;justify-content:space-between;align-items:baseline">
    <h1>📋 Booking Monitor</h1>
    <a id="logout" onclick="signOut()">Sign out</a>
  </div>
  <div id="status">Signing in…</div>
  <div id="list"></div>
</div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js';
import { getFirestore, collection, onSnapshot, query, orderBy, limit } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js';
import { getAuth, signInWithEmailAndPassword, signOut as fbSignOut, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js';

const firebaseConfig = {
  apiKey:"AIzaSyA8eaSBdVAjI80TywTx9lwIrczDBO8A2Y0",authDomain:"backstage-music.firebaseapp.com",
  databaseURL:"https://backstage-music-default-rtdb.firebaseio.com",projectId:"backstage-music",
  storageBucket:"backstage-music.firebasestorage.app",messagingSenderId:"864389877971",
  appId:"1:864389877971:web:c7d15ae843d54172c90426",measurementId:"G-DY40YLD9FM"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

const login = document.getElementById('login');
const dash  = document.getElementById('dashboard');
const list  = document.getElementById('list');
const stat  = document.getElementById('status');
const err   = document.getElementById('err');
const seen  = new Set();
let unsub;

if ('Notification' in window) Notification.requestPermission();

window.signIn = () => {
  const e = document.getElementById('email').value;
  const p = document.getElementById('pass').value;
  if (!e || !p) { err.textContent = 'Enter email and password'; return; }
  err.textContent = '';
  signInWithEmailAndPassword(auth, e, p).catch(x => { err.textContent = x.message; });
};

window.signOut = () => { fbSignOut(auth); };

onAuthStateChanged(auth, user => {
  if (user) {
    login.style.display = 'none';
    dash.style.display  = 'block';
    stat.textContent = 'Listening for new bookings…';
    if (unsub) unsub();
    unsub = onSnapshot(query(collection(db,'bookings'), orderBy('timestamp','desc'), limit(20)), snap => {
      stat.textContent = `Listening — ${snap.size} recent bookings`;
      snap.forEach(d => {
        if (seen.has(d.id)) return;
        seen.add(d.id);
        const b = d.data();
        const ts = b.timestamp?.toDate?.() || b.submittedAt?.toDate?.() || new Date();
        const entry = document.createElement('div');
        entry.className = 'entry new';
        entry.innerHTML = `
          <div class="name">${(b.name||b.firstName||'—')} ${(b.surname||'')}</div>
          <div class="detail">${b.instrument||b.focus||'—'} · ${b.lessonType||'—'}${b.chosenDate ? ' · '+b.chosenDate : ''}</div>
          <div class="detail">${ts.toLocaleString('en-ZA',{timeZone:'Africa/Johannesburg'})}${b.email ? ' · '+b.email : ''}${b.whatsapp||b.phone ? ' · '+(b.whatsapp||b.phone||'') : ''}</div>`;
        list.prepend(entry);
        if ('Notification' in window && Notification.permission === 'granted') {
          new Notification('New Booking!', { body: `${b.name||b.firstName||'Someone'} signed up for ${b.instrument||b.focus||'lessons'}` });
        }
      });
    }, e => { stat.textContent = 'Error: '+e.message; });
  } else {
    login.style.display = '';
    dash.style.display  = 'none';
    if (unsub) unsub();
    seen.clear();
    list.innerHTML = '';
  }
});
</script>
</body>
</html>
